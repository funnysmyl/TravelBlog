    <link rel="icon" href="./assets/img/Homepage/Logo.png" type="image">

    <link rel="stylesheet" href="./css styles/font.css">

    <link rel="stylesheet" href="./css styles/style.css">

<body>
    <header>
        <section class="header-section">
            <div class=nav-bar>
                <!-- !!LINK TO DUCKDUCKGO REPLACE WHEN REAL LINK IS AVAILABLE!! -->
                <a href="https://duckduckgo.com/" target="_blank" rel="noopener noreferer"><img src="./assets/img/header/travelblog-icon.svg" alt="Travelblog Logo"></a>

    <main>

        <!-- Yellow Box -->

        <section class="cappadocia-section">
            <div class="yellow-box">

            </div>

        </section>

        <!-- Contact Form -->
        <section class="contact-header">
            <figure>
                <img src="./assets/img/Homepage/person_pin.png" alt="Person Pin">
                <h2>Contact form</h2>
            </figure>
            <!-- <div>
                <p>Have a question or an idea to collaborate?</p>
                <p><br>Get in touch—I’d love to hear from you and explore how we can work together.</p>
            </div> -->
        </section>

        <form>
            <div>
                <label for="name">What's your name?</label>
                <input type="name" id="name" name="name">
                <label for="email">What's your email?</label>
                <input type="email" id="email" name="email">
                <label for="text">How can I help?</label>
                <input type="text" id="text" name="text">
            </div>
            <div>
                <label class="policy-checkbox">
                <input type="checkbox" name="policy">I've read the <span>privacy policy</span> and agree to the processing of my data as outlined.
                </label>
                <button type="send">Send</button>
            </div>
        </form>

        <!-- is a test only! -->

            <a href="">© Travel Blog 2026</a>
